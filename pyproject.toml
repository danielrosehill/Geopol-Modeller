[tool.poetry]
name = "geopol-forecaster"
version = "2.0.0-dev"
description = "Geopol Forecaster — multi-agent geopolitical wargaming platform (OpenRouter + LangGraph)"
license = "Apache-2.0"
authors = ["Daniel Hogan <6313241+dphogan@users.noreply.github.com>"]
readme = "README.md"
homepage = "https://github.com/danielrosehill/Geopol-Modeller"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
openai = "*"
langgraph = "*"
tavily-python = "*"
pyyaml = "*"
ruamel-yaml = "*"
pydantic = "*"
platformdirs = "*"
fastapi = "*"
uvicorn = "*"
watchfiles = "*"
rich = "*"
edge-tts = "*"
trafilatura = "*"
sse-starlette = "*"
httpx = "*"
huggingface_hub = "*"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
ruff = "^0.13.2"
pytest = "*"
pytest-asyncio = "*"

[tool.poetry.scripts]
geopol = "geopol_forecaster.cli:main"
geopol-web = "geopol_forecaster.web.app:main"
geopol-server = "geopol_forecaster.scripts:server"
geopol-game = "geopol_forecaster.user_defined_game:main"
geopol-sim = "geopol_forecaster.user_defined_sim:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
