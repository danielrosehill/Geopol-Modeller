[tool.poetry]
name = "llm-snowglobe"
version = "2.0.0-dev"
description = "Snow Globe multi-agent wargaming platform — OpenRouter + LangGraph"
license = "Apache-2.0"
authors = ["Daniel Hogan <6313241+dphogan@users.noreply.github.com>"]
readme = "README.md"
homepage = "https://github.com/danielrosehill/Geopol-Modeller"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
openai = "*"
langgraph = "*"
tavily-python = "*"
pyyaml = "*"
ruamel-yaml = "*"
pydantic = "*"
platformdirs = "*"
fastapi = "*"
uvicorn = "*"
watchfiles = "*"
rich = "*"
edge-tts = "*"
trafilatura = "*"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
ruff = "^0.13.2"
pytest = "*"
pytest-asyncio = "*"

[tool.poetry.scripts]
snowglobe = "llm_snowglobe.cli:main"
snowglobe_server = "llm_snowglobe.scripts:server"
snowglobe_game = "llm_snowglobe.user_defined_game:main"
snowglobe_simulation = "llm_snowglobe.user_defined_sim:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
