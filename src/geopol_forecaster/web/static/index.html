<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geopol Forecaster — LLM Wargaming Simulator</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #232733;
      --border: #2e3340;
      --text: #e4e6eb;
      --text-dim: #8b8f9a;
      --accent: #3498db;
      --accent-dim: #2980b9;
      --success: #2ecc71;
      --warning: #f0c040;
      --error: #e74c3c;
      --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "Fira Code", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
    }

    .header .subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      min-height: calc(100vh - 60px);
    }

    /* --- Control Panel --- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-family: var(--font);
      font-size: 0.9rem;
    }

    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .scenario-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover { background: var(--accent-dim); }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* --- Output Panel --- */
    .output {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-dot.running {
      background: var(--warning);
      animation: pulse 1.5s infinite;
    }

    .status-dot.complete { background: var(--success); }
    .status-dot.error { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .log-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    .log-panel h2 {
      font-size: 0.85rem;
      padding: 1rem 1.5rem 0.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1.5rem 1rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.8;
      color: var(--text-dim);
    }

    .log-content .entry {
      border-bottom: 1px solid var(--border);
      padding: 0.3rem 0;
    }

    .log-content .entry.status { color: var(--accent); }
    .log-content .entry.error { color: var(--error); }
    .log-content .entry.complete { color: var(--success); }

    /* --- Results --- */
    .results-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      display: none;
    }

    .results-panel.visible { display: block; }

    .results-panel h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .assessment {
      background: var(--surface-2);
      border-left: 3px solid var(--warning);
      border-radius: 0 4px 4px 0;
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
    }

    .assessment .q {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .assessment .a {
      color: var(--text-dim);
    }

    .actor-response {
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
    }

    .actor-response .name {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
    }

    .actor-response .text {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .pdf-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
    }

    .pdf-link:hover { text-decoration: underline; }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>SNOWGLOBE</h1>
    <span class="subtitle">LLM Wargaming Simulator</span>
  </div>

  <div class="container">
    <!-- Control Panel -->
    <div>
      <div class="panel">
        <h2>Configuration</h2>

        <div class="field">
          <label>Scenario</label>
          <select id="scenario-select">
            <option value="">Loading...</option>
          </select>
          <div class="scenario-meta" id="scenario-meta"></div>
        </div>

        <div class="field">
          <label>Model Pool</label>
          <select id="pool-select">
            <option value="">Loading...</option>
          </select>
        </div>

        <div class="field">
          <label>Reference URLs (one per line)</label>
          <textarea id="refs-input" placeholder="https://example.com/article&#10;https://example.com/report"></textarea>
        </div>

        <button class="btn btn-primary" id="run-btn" disabled>
          Run Simulation
        </button>
      </div>
    </div>

    <!-- Output -->
    <div class="output">
      <div class="status-bar">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
      </div>

      <div class="log-panel">
        <h2>Simulation Log</h2>
        <div class="log-content" id="log-content">
          <div class="empty-state">Select a scenario and pool, then run.</div>
        </div>
      </div>

      <div class="results-panel" id="results-panel">
        <h2>Results</h2>
        <div id="results-content"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    let currentCallId = null;
    let pollInterval = null;

    // --- Load config ---

    async function loadConfig() {
      try {
        const [scenarios, pools] = await Promise.all([
          fetch('/api/scenarios').then(r => r.json()),
          fetch('/api/pools').then(r => r.json()),
        ]);

        const scenarioSelect = $('scenario-select');
        scenarioSelect.innerHTML = scenarios.map(s =>
          `<option value="${s.id}">${s.title}</option>`
        ).join('');

        scenarioSelect.addEventListener('change', () => {
          const s = scenarios.find(x => x.id === scenarioSelect.value);
          if (s) {
            $('scenario-meta').textContent =
              `${s.moves} × ${s.timestep} | actors: ${s.actor_cluster}`;
          }
        });
        scenarioSelect.dispatchEvent(new Event('change'));

        const poolSelect = $('pool-select');
        poolSelect.innerHTML = pools.map(p =>
          `<option value="${p.name}" ${p.active ? 'selected' : ''}>${p.name} — ${p.player}</option>`
        ).join('');

        $('run-btn').disabled = false;
      } catch (e) {
        $('scenario-select').innerHTML = '<option>Error loading scenarios</option>';
        console.error(e);
      }
    }

    // --- Run simulation ---

    async function startRun() {
      const scenario = $('scenario-select').value;
      const pool = $('pool-select').value;
      const refsRaw = $('refs-input').value.trim();
      const refs = refsRaw ? refsRaw.split('\n').map(r => r.trim()).filter(Boolean) : [];

      if (!scenario || !pool) return;

      // Reset UI
      $('run-btn').disabled = true;
      $('log-content').innerHTML = '';
      $('results-panel').classList.remove('visible');
      setStatus('running', 'Starting simulation...');
      addLog('status', `Launching: scenario=${scenario}, pool=${pool}`);

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({scenario, pool, refs}),
        });
        const data = await res.json();

        if (data.call_id) {
          currentCallId = data.call_id;
          addLog('status', `Simulation spawned (call: ${data.call_id})`);
          startPolling(data.call_id);
        } else if (data.run_id) {
          // Local mode (non-Modal)
          currentCallId = data.run_id;
          addLog('status', `Run started (id: ${data.run_id})`);
          startSSE(data.run_id);
        }
      } catch (e) {
        setStatus('error', 'Failed to start: ' + e.message);
        addLog('error', e.message);
        $('run-btn').disabled = false;
      }
    }

    // --- Poll Modal function call ---

    function startPolling(callId) {
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/call/${callId}`);
          const data = await res.json();

          if (data.status === 'complete') {
            clearInterval(pollInterval);
            setStatus('complete', 'Simulation complete');
            addLog('complete', 'Simulation finished');
            showResults(data.result);
            $('run-btn').disabled = false;
          } else if (data.status === 'error') {
            clearInterval(pollInterval);
            setStatus('error', 'Error: ' + (data.error || 'unknown'));
            addLog('error', data.error || 'Unknown error');
            $('run-btn').disabled = false;
          } else {
            addLog('status', 'Running...');
          }
        } catch (e) {
          addLog('error', 'Poll failed: ' + e.message);
        }
      }, 5000);
    }

    // --- SSE for local mode ---

    function startSSE(runId) {
      const es = new EventSource(`/api/run/${runId}/stream`);
      es.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'done') {
          es.close();
          fetchResult(runId);
        } else if (data.type === 'complete') {
          setStatus('complete', 'Simulation complete');
          addLog('complete', data.message);
        } else if (data.type === 'error') {
          setStatus('error', data.message);
          addLog('error', data.message);
          $('run-btn').disabled = false;
          es.close();
        } else {
          addLog(data.type || 'status', data.message);
        }
      };
      es.onerror = () => {
        es.close();
        fetchResult(runId);
      };
    }

    async function fetchResult(runId) {
      try {
        const res = await fetch(`/api/run/${runId}/result`);
        const data = await res.json();
        if (data.status === 'complete') {
          setStatus('complete', 'Simulation complete');
          showResults(data);
        }
      } catch (e) {
        console.error(e);
      }
      $('run-btn').disabled = false;
    }

    // --- UI helpers ---

    function setStatus(state, text) {
      $('status-dot').className = 'status-dot ' + state;
      $('status-text').textContent = text;
    }

    function addLog(type, message) {
      const log = $('log-content');
      // Remove empty state
      const empty = log.querySelector('.empty-state');
      if (empty) empty.remove();

      const el = document.createElement('div');
      el.className = 'entry ' + type;
      const ts = new Date().toLocaleTimeString();
      el.textContent = `[${ts}] ${message}`;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function showResults(data) {
      const panel = $('results-panel');
      const content = $('results-content');
      content.innerHTML = '';

      // Assessments
      const assessments = data.assessments || (data.result && data.result.assessments) || [];
      if (assessments.length) {
        const h3 = document.createElement('h3');
        h3.textContent = 'Assessments';
        h3.style.cssText = 'margin-bottom: 0.8rem; font-size: 0.9rem;';
        content.appendChild(h3);

        assessments.forEach(a => {
          const div = document.createElement('div');
          div.className = 'assessment';
          div.innerHTML = `<div class="q">Q: ${esc(a.question)}</div>
            <div class="a">A: ${esc(a.answer)}</div>`;
          content.appendChild(div);
        });
      }

      // Actor responses
      const history = data.history || (data.result && data.result.history) || [];
      if (history.length) {
        const h3 = document.createElement('h3');
        h3.textContent = 'Narrative';
        h3.style.cssText = 'margin: 1.2rem 0 0.8rem; font-size: 0.9rem;';
        content.appendChild(h3);

        history.forEach(e => {
          const div = document.createElement('div');
          div.className = 'actor-response';
          const text = e.text.length > 500 ? e.text.substring(0, 500) + '...' : e.text;
          div.innerHTML = `<div class="name">${esc(e.name)}</div>
            <div class="text">${esc(text)}</div>`;
          content.appendChild(div);
        });
      }

      // PDF link
      const pdfFile = data.pdf_filename || (data.result && data.result.pdf_filename);
      if (pdfFile) {
        const a = document.createElement('a');
        a.className = 'pdf-link';
        a.href = `/api/reports/${pdfFile}`;
        a.target = '_blank';
        a.textContent = 'Download PDF Report';
        content.appendChild(a);
      }

      panel.classList.add('visible');
    }

    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // --- Init ---
    $('run-btn').addEventListener('click', startRun);
    loadConfig();
  </script>
</body>
</html>
