name: Sync predictions to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'data/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push data to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = 'danielrosehill/Geopol-Forecaster-Predictions'

          for f in os.listdir('data'):
              path = os.path.join('data', f)
              if os.path.isfile(path):
                  api.upload_file(
                      path_or_fileobj=path,
                      path_in_repo=f,
                      repo_id=repo_id,
                      repo_type='dataset',
                      commit_message=f'Sync {f} from GitHub',
                  )
                  print(f'Uploaded {f}')
          "
