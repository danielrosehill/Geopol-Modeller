  - "What is the probability that the US Congress passes legislation conditioning military aid to Israel within 2 years?"
  - "How does the generational shift in US public opinion translate into concrete policy changes, and on what timeline?"
  - "What is the probability that Saudi-Israeli normalization is achieved within 1 year, and what does it require?"
  - "Does AIPAC's spending successfully contain the progressive challenge, or does it accelerate backlash?"
  - "What is the most likely trajectory for US-Israel relations under a future Democratic administration?"
  - "How does the ICC/ICJ legal pressure affect the bilateral relationship — does the US sustain its shielding indefinitely?"

