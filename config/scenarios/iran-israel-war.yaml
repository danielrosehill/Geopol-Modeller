# timeframes:
#   - "+24h"
#   - "+72h"
#   - "+1 week"
#   - "+1 month"

nature: true
mode:
  - geopol

questions:
  - "In one sentence, what is the dominant trajectory?"
  - "What is the most dangerous escalation path that emerged?"
  - "Which actor's response was most consequential in shaping the outcome?"

mc_questions:
  - question: "Does Iran attempt to physically challenge the blockade?"
    options:
      - "Yes — direct naval confrontation"
      - "Yes — mines or asymmetric naval action"
      - "No — diplomatic/rhetorical response only"
      - "No — but activates proxies instead"

  - question: "Does Israel launch strikes on Iranian targets?"
    options:
      - "Yes"
      - "No"
      - "Prepares but holds"

  - question: "What happens to oil prices?"
    options:
      - "Spike above $150/barrel"
      - "Spike to $120-150 range"
      - "Moderate increase ($100-120)"
      - "Markets wait for clarity"

  - question: "What is the escalation level at the end of the timeframe?"
    options:
      - "De-escalation / diplomacy"
      - "Proxy exchanges only (baseline)"
      - "Direct Iran-Israel strikes"
      - "Sustained mutual strikes"
      - "Full conventional war"
