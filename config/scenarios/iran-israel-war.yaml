# Scenario: Iran-Israel War
# Pure situation description — runtime config lives in config/runs/

title: "Iran-Israel War"

scenario: |
  DATE: 13 April 2026

  TRIGGER EVENT: The United States has announced it will begin blockading
  Iranian ports, with the US military set to enforce a naval blockade
  targeting Iran's maritime commerce. Tehran has condemned the move as
  "piracy" and an act of aggression. The announcement comes amid
  escalating tensions in the Iran-Israel conflict and follows the
  breakdown of nuclear negotiations.

  CONTEXT:
  - The Iran-Israel conflict has been escalating through direct strikes and proxy warfare
  - The Strait of Hormuz handles approximately 21% of global oil transit
  - Iran has long declared that any blockade of Hormuz would be treated as an act of war
  - The US Navy maintains carrier strike groups and surface combatants in the region via CENTCOM
  - Iran possesses anti-ship cruise missiles, fast attack craft, naval mines, and shore-based missile batteries
  - Oil markets are already volatile; Brent crude has been climbing on regional tension
  - Iran's IRGC Navy has conducted exercises simulating strait-closure operations
  - Hezbollah has been reconstituting after 2024 Israeli decapitation strikes
  - Houthi anti-shipping operations continue in the Red Sea and Bab el-Mandeb
  - Multiple US allies (Japan, South Korea, India, EU states) are heavily dependent on Gulf oil transit
  - China imports roughly 40% of its oil through the Strait of Hormuz

  IMMEDIATE SITUATION:
  Each actor must decide their response. The blockade has been declared but physical
  enforcement posture is still being established.

  KEY QUESTIONS AT STAKE:
  - Does Iran attempt to run the blockade, or does it retaliate asymmetrically?
  - Does Israel use this moment to escalate against Iranian nuclear/military targets?
  - Do US allies support or distance themselves from the blockade?
  - Does the oil market shock create pressure for immediate de-escalation?
  - Do Iranian proxies (Hezbollah, Houthis) activate in response?
  - Does this escalate to direct Iran-Israel kinetic exchange?

mode:
  - geopol
