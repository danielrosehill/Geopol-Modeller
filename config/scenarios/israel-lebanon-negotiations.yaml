  - "Does the Iran ceasefire survive, or does Lebanon escalation collapse it?"
  - "What is the most likely long-term security arrangement for southern Lebanon?"

mc_questions:
  - question: "What happens at the Washington negotiations?"
    options:
      - "Framework agreement reached — phased ceasefire and disarmament"
      - "Partial progress — ceasefire extended but no disarmament framework"
      - "Talks collapse — positions too far apart"
      - "Talks never begin — violence escalates before they start"

  - question: "What is Hezbollah's posture during negotiations?"
    options:
      - "Restraint — holds fire to give diplomacy a chance"
      - "Calibrated provocations — periodic rocket fire to signal resolve"
      - "Major escalation — large barrage to disrupt talks"
      - "Political engagement — participates indirectly through Lebanese government"

  - question: "Does the Iran ceasefire (expiring April 22) get renewed?"
    options:
      - "Yes — extended and expanded to include Lebanon"
      - "Yes — extended but Lebanon remains excluded"
      - "No — collapses due to Lebanon violence"
      - "No — collapses due to other factors (nuclear, Hormuz)"

  - question: "What is the escalation level at the end of the scenario?"
    options:
      - "De-escalation — ceasefire on all fronts"
      - "Mixed — ceasefire with Iran, continued operations in Lebanon"
      - "Escalation — renewed full-scale war across Lebanon"
      - "Regional escalation — conflict expands beyond bilateral"
