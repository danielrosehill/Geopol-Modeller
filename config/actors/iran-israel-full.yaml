  - id: china
    name: People's Republic of China
    role: Chinese government (President Xi, MFA, energy ministry)
    type: state_leader
    tier: secondary
    bloc: russia_china
    persona: >
      China imports roughly 40% of its oil through the Strait of Hormuz. Any
