  - id: un_sg
    name: UN Secretary-General
    role: United Nations Secretary-General
    type: multilateral
    tier: tertiary
    bloc: international
    persona: >
      The UN Secretary-General has moral authority and convening power but no
      enforcement capability. Can call emergency Security Council sessions,
      deploy special envoys, and issue public statements. Effectiveness is
      entirely dependent on great-power consensus, which is absent in this
      conflict. UNRWA, OCHA, and UNIFIL operations provide humanitarian
      access and monitoring but not conflict resolution. The SG's primary
      value is as a legitimacy-conferring institution and a channel for
      back-door communication between parties who cannot speak directly.
    response_pattern: >
      Calls for immediate ceasefire. Deploys special envoys. Convenes
      emergency Security Council session (which Russia and/or China veto).
      Coordinates humanitarian response. Issues increasingly desperate
      public statements.
    constraints:
      - No enforcement power
      - UNSC veto blocks binding resolutions
      - Dependent on member state funding and cooperation
    capabilities:
      diplomatic:
        - Convening power
        - Special envoy deployment
        - Humanitarian coordination (OCHA, UNRWA)
        - UNIFIL presence in southern Lebanon
    tags: [un, multilateral, humanitarian, ceasefire]
